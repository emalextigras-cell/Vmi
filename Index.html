<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VMI – prototype Bluetooth</title>
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#1d2a22;--mut:#5d6b62;--acc:#2f6b4f;--line:#d5dcd3;--warn:#a4411f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d2620;--ink:#e6ede8;--mut:#9baba0;--acc:#7fcf9f;--line:#2e3a32;--warn:#f0a07f;color-scheme:dark}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0 .1em}
p.s{color:var(--mut);margin:0 0 14px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.big{display:flex;gap:10px;flex-wrap:wrap}
.m{flex:1 1 120px}
.m b{display:block;font-size:1.9rem;line-height:1.1}
.m span{color:var(--mut);font-size:.85rem}
button{font:inherit;padding:10px 14px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);margin:4px 4px 4px 0}
button.o{background:transparent;color:var(--acc)}
button:disabled{opacity:.45}
#st{color:var(--mut);font-size:.9rem}
#err{color:var(--warn)}
pre{margin:0;max-height:220px;overflow:auto;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>VMI : prototype Bluetooth</h1>
<p class="s">Ferme l’appli VMI+ avant de te connecter : la VMI n’accepte qu’une seule connexion.</p>

<div class="card">
<button id="conn">Se connecter</button><button id="disc" class="o" disabled>Déconnecter</button>
<div id="st">Non connecté.</div><div id="err"></div>
</div>

<div class="card big">
<div class="m"><b id="tp">–</b><span>Pièce, °C</span></div>
<div class="m"><b id="hp">–</b><span>Pièce, humidité %</span></div>
<div class="m"><b id="ti">–</b><span>Sonde interne, °C</span></div>
<div class="m"><b id="hi">–</b><span>Sonde interne, humidité %</span></div>
</div>

<div class="card">
<div>Vitesse : <b id="sp">–</b> · Boost : <b id="bo">–</b> · Bypass : <b id="by">–</b> · Vacances : <b id="ho">–</b> · Mode nuit : <b id="ni">–</b></div>
</div>

<div class="card">
<div>Vitesse
<button class="o" data-r="24" data-v="0">1</button><button class="o" data-r="24" data-v="1">2</button><button class="o" data-r="24" data-v="2">3</button></div>
<div>Boost
<button class="o" data-r="25" data-v="1">Activer</button><button class="o" data-r="25" data-v="0">Arrêter</button></div>
<div>Bypass
<button class="o" data-r="47" data-v="1">Activer</button><button class="o" data-r="47" data-v="0">Arrêter</button></div>
</div>

<div class="card">
<button id="csv" class="o">Exporter l’historique (CSV)</button><button id="cp" class="o">Copier le journal brut</button>
<pre id="log"></pre>
</div>
</main>
<script>
const SVC_C='0003cbbb-0000-1000-8000-00805f9b0131',CH_C='0003cbb1-0000-1000-8000-00805f9b0131';
const SVC_T='0003cab5-0000-1000-8000-00805f9b0131',CH_T='0003caa2-0000-1000-8000-00805f9b0131';
const $=id=>document.getElementById(id);
let dev,chC,chT,timer,hist=[],cur={},logLines=[];
function crc(d){let c=0;for(const b of d){c^=b;for(let i=0;i<8;i++)c=(c&0x80)?(((c<<1)^1)&0xFF):((c<<1)&0xFF);}return c^0x13}
function frame(reg,val){const d=[0xA5,0xB6,0x10,0x06,0x05,reg,0,0,0,val];return new Uint8Array([...d,crc(d)])}
const hex=a=>[...a].map(x=>x.toString(16).padStart(2,'0')).join('');
function log(s){logLines.push(s);if(logLines.length>300)logLines.shift();const p=$('log');p.textContent=logLines.slice(-40).join('\n');p.scrollTop=p.scrollHeight}
function err(e){$('err').textContent=e?String(e.message||e):''}
async function send(reg,val){try{await chC.writeValue(frame(reg,val));log('> '+hex(frame(reg,val)))}catch(e){err(e)}}
function onNotif(ev){
  const a=new Uint8Array(ev.target.value.buffer);log('< '+hex(a));
  if(a[0]!==0xA5||a[1]!==0xB6)return;
  const t=a[2];
  if(t===1&&a.length>53){cur.vit=a[34]+1;cur.boost=a[44];cur.bypass=a[53];cur.hol=a[43];cur.nuit=a[33]===0?1:0;
    $('sp').textContent=cur.vit;$('bo').textContent=a[44]?'oui':'non';$('by').textContent=a[53]?'oui':'non';$('ho').textContent=a[43]?'oui':'non';$('ni').textContent=cur.nuit?'oui':'non'}
  else if(t===2&&a.length>13){cur.tp=a[11];cur.hp=a[13];$('tp').textContent=a[11];$('hp').textContent=a[13]}
  else if(t===3&&a.length>8){cur.ti=a[6];cur.hi=a[8];$('ti').textContent=a[6];$('hi').textContent=a[8]}
  else return;
  if(t!==1)hist.push({t:new Date().toISOString(),...cur});
}
async function poll(){for(const r of [3,6,7]){await send(r,0);await new Promise(r=>setTimeout(r,400))}}
$('conn').onclick=async()=>{
  err('');
  try{
    dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SVC_C,SVC_T]});
    dev.addEventListener('gattserverdisconnected',()=>{clearInterval(timer);$('st').textContent='Déconnecté.';$('conn').disabled=false;$('disc').disabled=true});
    $('st').textContent='Connexion à '+(dev.name||'appareil')+'…';
    const s=await dev.gatt.connect();
    chC=await (await s.getPrimaryService(SVC_C)).getCharacteristic(CH_C);
    chT=await (await s.getPrimaryService(SVC_T)).getCharacteristic(CH_T);
    await chT.startNotifications();chT.addEventListener('characteristicvaluechanged',onNotif);
    try{await chC.startNotifications();chC.addEventListener('characteristicvaluechanged',onNotif)}catch(e){}
    $('st').textContent='Connecté à '+(dev.name||'appareil')+'.';$('conn').disabled=true;$('disc').disabled=false;
    poll();timer=setInterval(poll,10000);
  }catch(e){err(e);$('st').textContent='Connexion impossible.'}
};
$('disc').onclick=()=>{clearInterval(timer);if(dev&&dev.gatt.connected)dev.gatt.disconnect()};
document.querySelectorAll('button[data-r]').forEach(b=>b.onclick=async()=>{if(chC){await send(+b.dataset.r,+b.dataset.v);setTimeout(poll,500)}});
$('csv').onclick=()=>{
  const k=['t','tp','hp','ti','hi','vit','boost','bypass'];
  const csv=[k.join(',')].concat(hist.map(r=>k.map(x=>r[x]??'').join(','))).join('\n');
  const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='vmi-historique.csv';a.click()};
$('cp').onclick=()=>navigator.clipboard.writeText(logLines.join('\n')).then(()=>err('Journal copié.'),e=>err(e));
if(!navigator.bluetooth)err('Web Bluetooth indisponible : ouvre cette page directement dans Chrome sur Android.');
</script>
</body>
</html>
